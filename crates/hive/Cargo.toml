[package]
name = "hive"
description = "Hive node CLI — headless compute node and diagnostics. The Tauri desktop app wraps the same core."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "hive"
path = "src/main.rs"

[dependencies]
hive-core = { workspace = true, features = ["hub", "probe", "sandbox", "skills"] }
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
dirs = "5"

[features]
default = ["llama-cpp", "whisper", "comfyui"]
llama-cpp = ["hive-core/llama-cpp"]
whisper = ["hive-core/whisper"]
comfyui = ["hive-core/comfyui"]
# ADR-035 C1: Bots chat and agent collaboration -- lets this node register/list itself as a
# local AgentProfile, and (`hive bots work`) drain its own pending deliveries through a real
# local model turn (2026-09-15, Jack: "I want the computers to show up as agents in Hive").
# Opt-in, not in `default`, same posture as this crate's other backend features. `hive bots
# work` additionally needs `llama-cpp` (already in `default`) for the loopback turn runner;
# `agent-register`/`agent-list` don't.
bots = ["hive-core/bots", "hive-core/local-hub"]
