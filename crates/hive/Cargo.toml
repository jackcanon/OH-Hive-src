[package]
name = "hive"
description = "Hive node CLI — headless compute node and diagnostics. The Tauri desktop app wraps the same core."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "hive"
path = "src/main.rs"

[dependencies]
hive-core = { workspace = true, features = ["hub", "probe", "sandbox"] }
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
dirs = "5"

[features]
default = ["llama-cpp", "whisper", "comfyui"]
llama-cpp = ["hive-core/llama-cpp"]
whisper = ["hive-core/whisper"]
comfyui = ["hive-core/comfyui"]
