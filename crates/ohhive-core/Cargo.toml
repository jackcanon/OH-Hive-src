[package]
name = "ohhive-core"
description = "OH Hive core: node identity, capabilities, jobs, the Backend trait, and the P2P/coordinator client. Shared by hive, hive-server, hive-coordinator, and the desktop app."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
futures.workspace = true
reqwest = { workspace = true, optional = true }
bytes = { version = "1", optional = true }
anyhow = { workspace = true, optional = true }
dirs = { version = "5", optional = true }
sysinfo = { version = "0.33", optional = true, default-features = false, features = ["system", "disk"] }

[features]
default = []
# Inference backends are opt-in so hive-server (regional, Pi-class) builds without them. See ADR-003 D12/D62.
llama-cpp = ["dep:reqwest", "dep:bytes"]
# Talk to the hub (Supabase RPCs): check-in, heartbeat, check-out, pairing. Both shells need it.
hub = ["dep:reqwest", "dep:anyhow", "dep:dirs"]
# Real hardware probe (CPU/RAM/disk; GPU via vendor tools). Node app + CLI.
probe = ["dep:sysinfo"]
mlx = []
comfyui = []
whisper = []
tts = []

[dev-dependencies]
tokio = { workspace = true }
