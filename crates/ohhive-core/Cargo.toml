[package]
name = "hive-core"
description = "Hive core: node identity, capabilities, jobs, the Backend trait, and the P2P/coordinator client. Shared by hive, hive-server, hive-coordinator, and the desktop app."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
futures.workspace = true
reqwest = { workspace = true, optional = true }
bytes = { version = "1", optional = true }
anyhow = { workspace = true, optional = true }
dirs = { version = "5", optional = true }
tracing-subscriber = { workspace = true, optional = true }
tracing-appender = { workspace = true, optional = true }
sysinfo = { version = "0.33", optional = true, default-features = false, features = ["system", "disk"] }
wasmtime = { version = "48.0.1", optional = true }
wasmtime-wasi = { version = "48.0.1", optional = true }

cap-std = { version = "4.0.3", optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
sha2 = { version = "0.10", optional = true }
rand = { version = "0.8", optional = true }
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "json"], optional = true }

ring = { version = "0.17.14", optional = true }
base64 = { version = "0.22", optional = true }
png = { version = "0.17", optional = true }

serde_yaml_ng = { version = "0.10", optional = true }

[features]
default = []
skills = ["dep:cap-std", "dep:sha2", "dep:serde_yaml_ng"]
desktop-provider = ["dep:reqwest", "dep:base64", "dep:png"]
local-hub = ["dep:cap-std", "hub", "tunnel", "dep:rusqlite", "dep:sha2", "dep:rand", "dep:axum", "dep:ring", "dep:base64"]
# Inference backends are opt-in so hive-server (regional, Pi-class) builds without them. See ADR-003 D12/D62.
llama-cpp = ["dep:reqwest", "dep:bytes"]
# whisper.cpp adapter (M8 first slice). Needs reqwest's multipart feature for
# audio upload, on top of what llama-cpp already pulls in.
whisper = ["dep:reqwest", "dep:bytes", "dep:sha2"]
# ComfyUI adapter (M8 first slice, text-to-image only).
comfyui = ["dep:reqwest", "dep:bytes"]
# Talk to the hub (Supabase RPCs): check-in, heartbeat, check-out, pairing. Both shells need it.
hub = ["dep:reqwest", "dep:anyhow", "dep:dirs", "dep:tracing-subscriber", "dep:tracing-appender"]
# Real hardware probe (CPU/RAM/disk; GPU via vendor tools). Node app + CLI.
probe = ["dep:sysinfo"]
# First-run assessment + Ollama install/pull (ADR-010/ADR-018). Needs the hub feature's
# reqwest/anyhow/dirs and the probe feature's hardware probe.
setup = ["hub", "probe"]
# Cloudflare Tunnel automation (ADR-013 D74/ADR-018). Needs the hub feature's anyhow/dirs.
tunnel = ["hub"]
mlx = []
tts = []
# WASI-component tool sandbox (ADR-006 D45/D46). Only where cards actually execute
# (hive, ohhive-desktop) — hive-server never runs cards, stays free of this.
sandbox = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:dirs", "dep:sha2", "dep:base64"]
# ADR-033 Stage 1: local Codex app-server JSON-RPC runtime contract (protocol/transport/fake
# server/event reducer only -- no OAuth, no process spawning yet). No extra deps: tokio's "full"
# feature (already a base dependency) covers process/io/sync/time.
subscription-coordinator = ["dep:dirs", "dep:rusqlite", "dep:sha2"]
# ADR-035 C0: Bots chat and agent collaboration -- domain types + service interface only (no
# LocalHub storage impl, no FFI, no UI yet). No extra deps: serde/chrono/uuid/async-trait/
# thiserror are already base dependencies.
bots = ["dep:dirs"]

[dev-dependencies]
tracing-subscriber.workspace = true
# `test-util` is what gives the supervisor tests `start_paused`: its backoff ladder tops out
# at five minutes and its idle ping is a minute, so real time would mean a test suite that
# takes a quarter of an hour to assert something that happens instantly on a virtual clock.
tokio = { workspace = true, features = ["test-util"] }

[[example]]
name = "local_hub"
required-features = ["local-hub", "llama-cpp", "sandbox"]

[[example]]
name = "coordinator_pilot"
required-features = ["hub", "llama-cpp", "sandbox"]

[[example]]
name = "coordinator_recovery_probe"
required-features = ["hub"]

[[example]]
name = "vault_folder"
required-features = ["local-hub"]

[[example]]
name = "vault_validation"
required-features = ["local-hub"]

[[example]]
name = "vault_intake"
required-features = ["local-hub"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[[example]]
name = "private_task_smoke"
required-features = ["local-hub", "llama-cpp", "sandbox"]
