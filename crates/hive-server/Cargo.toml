[package]
name = "hive-server"
description = "OH Hive regional server — headless artifact store, relay, model cache, coordinator candidate. Must build and run on a Raspberry Pi (ADR-003 D12). No inference backends, ever."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "hive-server"
path = "src/main.rs"

[dependencies]
ohhive-core = { workspace = true, default-features = false, features = ["hub"] }
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "json", "query", "ws"] }
tower-http = { version = "0.6", features = ["cors", "limit"] }
sha2 = "0.10"
reqwest.workspace = true
hex = "0.4"
dirs = "5"
flate2 = "1"
age = { version = "0.12", default-features = false }
