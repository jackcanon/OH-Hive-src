[package]
name = "hive-server"
description = "Hive regional server — headless artifact store, relay, model cache, coordinator candidate. Must build and run on a Raspberry Pi (ADR-003 D12). No inference backends, ever."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "hive_server"
path = "src/lib.rs"

[[bin]]
name = "hive-server"
path = "src/main.rs"

[dependencies]
hive-core = { workspace = true, default-features = false, features = ["hub"] }
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "json", "query", "ws"] }
tower-http = { version = "0.6", features = ["cors", "limit"] }
sha2 = "0.10"
reqwest.workspace = true
hex = "0.4"
dirs = "5"
flate2 = "1"
age = { version = "0.12", default-features = false }
parquet = { version = "54.3.1", default-features = false }

tokio-postgres = { version = "0.7", optional = true, features = ["with-serde_json-1", "with-uuid-1", "with-chrono-0_4"] }
postgres-native-tls = { version = "0.5", optional = true }
native-tls = { version = "0.2", optional = true }
hmac = { version = "0.12", optional = true }
rand = { version = "0.8", optional = true }
chrono = { workspace = true, optional = true }
hive-coordinator = { path = "../hive-coordinator", optional = true }

[dev-dependencies]
tokio-tungstenite = "0.24"
futures.workspace = true
bytes = "1.12.1"

[features]
control-pilot = ["dep:tokio-postgres", "dep:postgres-native-tls", "dep:native-tls", "dep:hmac", "dep:rand", "dep:chrono", "dep:hive-coordinator"]

[[bin]]
name = "hive-control-pilot"
path = "src/bin/hive-control-pilot.rs"
required-features = ["control-pilot"]
