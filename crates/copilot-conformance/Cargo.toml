[package]
name = "hive-copilot-conformance"
version = "0.1.0"
edition = "2021"
publish = false

# Deliberately isolated: P2 does not add a runtime to the shipping Hive binaries.
[workspace]

[features]
coordinator-adapter = ["dep:hive-core", "dep:async-trait", "dep:uuid"]
bundled-runtime = ["github-copilot-sdk/bundled-cli"]

[dependencies]
hive-core = { path = "../ohhive-core", features = ["subscription-coordinator"], optional = true }
async-trait = { version = "0.1", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
github-copilot-sdk = { version = "=1.0.14", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }

[[bin]]
name = "hive-copilot-check"
path = "src/main.rs"
required-features = ["bundled-runtime"]
