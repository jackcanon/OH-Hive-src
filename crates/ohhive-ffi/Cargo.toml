[package]
name = "hive-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "UniFFI bridge exposing hive-core's desktop surface to the native macOS Swift app (ADR-018)"

[lib]
name = "ohhive_ffi"
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
hive-core = { workspace = true, features = ["hub", "probe", "llama-cpp", "whisper", "comfyui", "sandbox", "setup", "tunnel"] }
hive-server = { path = "../hive-server" }
uniffi = { version = "0.32", features = ["cli"] }
reqwest = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
once_cell = "1"
