[workspace]
resolver = "2"
members = [
  "crates/ohhive-core",
  "crates/hive",
  "crates/hive-server",
  "crates/hive-coordinator",
  "crates/ohhive-ffi",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Happy Jack Media <jack@happyjack.media>"]
repository = "https://github.com/jackcanon/OH-Hive-src"
rust-version = "1.95"

[workspace.dependencies]
ohhive-core = { path = "crates/ohhive-core", default-features = false }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
