[package]
name = "ohhive-desktop"
description = "Hive desktop node app (Tauri shell around hive-core). ADR-010."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "ohhive_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hive-core = { workspace = true, features = ["hub", "probe", "llama-cpp", "sandbox", "setup", "tunnel"] }
hive-server = { path = "../../../crates/hive-server" }
reqwest.workspace = true
futures.workspace = true
dirs = "6"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
chrono.workspace = true
tracing.workspace = true
