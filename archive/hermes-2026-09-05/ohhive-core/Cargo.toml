[package]
name = "ohhive-core"
version = "0.1.0"
edition = "2021"
description = "OH Hive core library: compute node backends and job management"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[[bin]]
name = "backend-trait"
path = "src/main.rs"
