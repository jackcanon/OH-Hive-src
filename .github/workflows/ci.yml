name: ci
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      # Without this, the first leg to fail cancels the other two — and since the macOS leg is
      # usually the fastest to reach clippy, the Windows and Linux legs have been getting cancelled
      # mid-build for weeks. That is not a small inefficiency: it means a red run told us nothing at
      # all about Windows or Linux, and we had no idea whether the shared core even passed its tests
      # there. Each platform now reports its own verdict.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09-03)
        with: { components: clippy, rustfmt }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Tauri needs webkit on Linux, so the desktop crate is excluded here and covered by
      # the `desktop-crate` job below, which installs those system libraries first.
      - name: build + test (core, cli, server, coordinator)
        run: cargo test --workspace --exclude ohhive-desktop
      # Check the CLI in isolation: workspace feature unification can hide missing-feature bugs.
      - name: standalone CLI lint
        run: cargo clippy -p hive --all-targets -- -D warnings
      # `--all-targets` is what makes this gate cover tests, benches and examples. Without it the
      # run lints lib and bins only, and 17 clippy errors had accumulated in test code that no
      # gate could see -- the same shape as the standalone-CLI failure above. The two runs are not
      # redundant: this one is the workspace under feature unification, that one is a single crate
      # on its own. Keep both.
      - run: cargo clippy --workspace --exclude ohhive-desktop --all-targets -- -D warnings
      - run: cargo fmt --all -- --check

  pi-footprint:
    # hive-server must cross-compile for ARM64 Linux with no inference deps (ADR-003 D12).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09-03)
        with: { targets: aarch64-unknown-linux-musl }
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with: { tool: cross }
      - name: enforce server dependency footprint
        shell: bash
        run: |
          set -euo pipefail
          cargo tree -p hive-server --target aarch64-unknown-linux-musl --edges normal,build --prefix none > server-dependencies.txt
          if grep -E '^(wasmtime[^ ]*|sysinfo|rusqlite|openssl[^ ]*) v' server-dependencies.txt; then
            echo "hive-server must not include inference, sandbox, SQLite or OpenSSL dependencies"
            exit 1
          fi
      - run: cross build -p hive-server --release --target aarch64-unknown-linux-musl
      - run: ls -lh target/aarch64-unknown-linux-musl/release/hive-server

  migrations:
    # ADR-013 D70 + ADR-001: no hive.* table in Realtime; RLS on every hive table. Static half; live half is pg_cron hive.schema_guards.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - run: bash scripts/check-migrations.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: npm ci --prefix scripts/migration-replay --ignore-scripts --no-audit --no-fund
      - name: replay all migrations and verify funded speech settlement
        shell: bash
        run: |
          export PGLITE_MODULE="$GITHUB_WORKSPACE/scripts/migration-replay/node_modules/@electric-sql/pglite/dist/index.js"
          export REPLAY_CATALOG="$RUNNER_TEMP/hive-replay-catalog.json"
          export REPLAY_FUNCTIONS="$RUNNER_TEMP/hive-replay-functions.json"
          node scripts/test-migration-replay.mjs
          python3 scripts/migration-replay/compare-baseline.py --catalog "$REPLAY_CATALOG" --functions "$REPLAY_FUNCTIONS"
          node scripts/test-speech-pricing.mjs
          node scripts/test_private_fleet_rls.mjs "$PGLITE_MODULE"
          node scripts/test-code-brain-usage.mjs
          node scripts/test-code-session-acceptance.mjs
          node scripts/test-reap-orphaned-leases.mjs
          node scripts/test-node-last-seen.mjs
          node scripts/test-acceptance-capability-gate.mjs
          node scripts/test-acceptance-capability-gate-ctl.mjs

  functions:
    name: functions (Deno)
    # supabase/functions/ had THREE test files -- bots-turn/handler_test.ts,
    # code-brain-turn/protocol_test.ts, private-fleet-enroll/handler_test.ts, 25 tests between them
    # -- and no job in this workflow ran any of them. Same shape as the Swift app that was never
    # built and the Python tests nothing executed: the tests were written, passed when someone
    # remembered to run them locally, and told CI nothing. These are the Edge Functions that hold
    # the provider keys, the enrollment signing and the cloud brain spend guard.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with: { deno-version: v2.x }
      # index.ts files import npm:@supabase/supabase-js and are deliberately excluded: resolving
      # that would mean an npm install for a file whose only job is reading env vars and calling
      # createHandler. Everything with logic in it is checked.
      - name: type-check every function module that is not an npm entrypoint
        run: |
          set -euo pipefail
          mapfile -t files < <(find supabase/functions -name '*.ts' ! -name 'index.ts' | sort)
          printf 'checking %s\n' "${files[@]}"
          deno check "${files[@]}"
      # A test file that exists but is never collected is the bug this job was added to fix, so the
      # run is checked against what is on disk rather than trusted. NO_COLOR matters: with ANSI
      # codes wrapped around them the "running N tests from ..." lines do not start at column 0 and
      # a grep finds nothing, which would make this guard pass by accident the day it should fail.
      # (`deno test` has no --no-color flag -- it is the env var or nothing.)
      - name: run the function tests, and prove every test file on disk was collected
        env: { NO_COLOR: "1" }
        run: |
          set -euo pipefail
          deno test supabase/functions/ 2>&1 | tee /tmp/deno-test.log
          on_disk=$(find supabase/functions -name '*_test.ts' | wc -l | tr -d ' ')
          ran=$(grep -c 'running [0-9]* test.* from ' /tmp/deno-test.log || true)
          echo "test files on disk: $on_disk; files deno collected: $ran"
          [ "$on_disk" = "$ran" ] || { echo "FAIL: $on_disk test files exist but deno ran $ran"; exit 1; }

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (version comes from package.json packageManager)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hive/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

  swift:
    # The Swift app had NO coverage in this workflow at all until 2026-09-16 -- not here, not in
    # any script. `swift build`/`swift test` ran only on whichever Mac an agent happened to be
    # using, and only at release time via release.yml's desktop-swift-macos job, which is far too
    # late to catch a compile error. That gap is exactly how an `@Published` property on an
    # `@Observable` class reached a commit: `swiftc -parse` accepted it (parse is not a build) and
    # nothing in CI ever ran a real build. This job closes it.
    #
    # Deliberately NOT continue-on-error. A `continue-on-error` step is reported as *succeeded*
    # by the steps API -- only `outcome` holds the truth -- and we have already misread a skipped
    # step in a cancelled job as a pass once. A job that cannot fail tells us nothing.
    name: desktop (Swift, macOS Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09-03)
        with: { targets: aarch64-apple-darwin }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { key: ci-swift-aarch64-apple-darwin }
      - name: swift version (recorded so a toolchain bump is visible in the log)
        run: swift --version && xcodebuild -version
      # The Swift package links a real FFI dylib and its generated bindings; it cannot build
      # without them. Same sequence release.yml's build-app.sh uses, kept in step with it on
      # purpose -- if these two ever diverge, CI stops testing what we ship.
      - name: build hive-ffi and generate matching Swift bindings
        run: |
          set -euo pipefail
          cargo build --locked --release --target aarch64-apple-darwin -p hive-ffi --lib
          FFI_DIR="$RUNNER_TEMP/ffi"
          mkdir -p "$FFI_DIR" "$RUNNER_TEMP/bindings"
          cp target/aarch64-apple-darwin/release/libohhive_ffi.dylib "$FFI_DIR/"
          install_name_tool -id '@rpath/libohhive_ffi.dylib' "$FFI_DIR/libohhive_ffi.dylib"
          cargo run --locked --release --target aarch64-apple-darwin -p hive-ffi --bin uniffi-bindgen -- \
            generate --library "$FFI_DIR/libohhive_ffi.dylib" --language swift --out-dir "$RUNNER_TEMP/bindings"
          # Sources/OHHiveFFI/ holds only generated, gitignored output, so the directory does
          # not exist in a clean checkout -- build-app.sh gets away without this because the
          # directory already exists on a machine that has built before. The first CI run of
          # this job failed here with "cp: .../ohhive_ffi.swift: No such file or directory"
          # after an 11-minute Rust build.
          mkdir -p apps/desktop-swift/Sources/OHHiveFFI apps/desktop-swift/Sources/ohhive_ffiFFI
          cp "$RUNNER_TEMP/bindings/ohhive_ffi.swift" apps/desktop-swift/Sources/OHHiveFFI/ohhive_ffi.swift
          cp "$RUNNER_TEMP/bindings/ohhive_ffiFFI.h" apps/desktop-swift/Sources/ohhive_ffiFFI/ohhive_ffiFFI.h
          echo "OHHIVE_FFI_LIBRARY_DIR=$FFI_DIR" >> "$GITHUB_ENV"
      # A real build, not `swiftc -parse`. This is the step that would have caught @Published.
      - name: swift build
        working-directory: apps/desktop-swift
        run: swift build -c debug -Xlinker -rpath -Xlinker "$OHHIVE_FFI_LIBRARY_DIR"
      - name: swift test
        working-directory: apps/desktop-swift
        run: swift test -Xlinker -rpath -Xlinker "$OHHIVE_FFI_LIBRARY_DIR"
      # NOTE: there is deliberately no "generated bindings match the ones committed" check here.
      # I wrote one in the first version of this job and it was worthless: .gitignore lines 39-40
      # exclude both generated files on purpose, so `git diff --exit-code` over those paths can
      # never fail and the step would have passed forever while proving nothing. The real
      # guarantee is `swift build` above -- it compiles the freshly generated bindings against
      # the committed module.modulemap, so a drift between Rust and Swift fails there for real.

  desktop-crate:
    # `ohhive-desktop` -- the Tauri shell, and the Windows/Linux face of the Den (ADR-018 d1) --
    # is excluded from the `rust` job above by name, on both `cargo test` and `cargo clippy`. The
    # stated reason is real: Tauri v2 links against webkit2gtk on Linux, and without those system
    # libraries the build dies in pkg-config in a way that looks like a code error and isn't one.
    #
    # But "skip it on Linux" turned into "never lint or test it anywhere". Nothing in CI has ever
    # run this crate's own tests. `apps/desktop/src-tauri/src/bots/store_cache.rs` carries three
    # of them -- concurrent readers sharing one initialisation, cache invalidation on path change,
    # failure handling -- and they have only ever run on the machine of whoever wrote them.
    #
    # That is the same hole the Swift app sat in until the `swift` job above was added this
    # morning, and it is the hole an `@Published` on an `@Observable` class came through: code
    # that compiles on one developer's Mac is not the same claim as code that compiles anywhere.
    #
    # Linux only, deliberately. Windows already compiles this crate on every `main` push via
    # desktop-windows-linux.yml's bundle stage, so compilation is covered there; what was missing
    # on every platform is lint and unit tests, and one cheap runner buys that. Windows runner
    # minutes bill at 2x and duplicating them here would pay double for a signal we already have.
    name: desktop crate (Tauri, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09-03)
        with: { components: clippy }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { key: ci-desktop-crate }
      # Kept in step with desktop-windows-linux.yml's "linux webview dependencies" step on
      # purpose: if Tauri's system deps change, both places need the same edit, and a comment in
      # each is cheaper than discovering the drift through a red build.
      - name: linux webview dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf
      # `--lib` scopes this to the crate's own code. The Tauri binary needs a bundled frontend to
      # link, which is the bundle stage's job in the other workflow, not a unit-test concern.
      - name: cargo test (ohhive-desktop)
        run: cargo test -p ohhive-desktop --lib
      - name: cargo clippy (ohhive-desktop)
        run: cargo clippy -p ohhive-desktop --lib -- -D warnings

  scripts:
    # The repo's Python tests had never run in CI. `python3` appears in this workflow exactly once
    # before now -- as a helper inside the migrations job -- so scripts/test_codex_effort_report.py
    # (Sif's) and scripts/test_cloud_card.py (written by a Den card, PR #29) both sat in the tree
    # with nothing executing them.
    #
    # Third variant of one problem in two days: the Swift app, the Tauri crate, now scripts/. Each
    # time tests existed and passed on the author's machine, and each time the absence was
    # invisible precisely because the author kept running them successfully.
    #
    # Stdlib unittest, no pytest and no requirements file: these scripts are deliberately
    # dependency-free so they run on a node, in a sandbox, or on a fresh machine. A CI job needing
    # dependencies they don't have would be testing something other than what ships.
    name: scripts (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      # Deliberately NOT `unittest discover`. `scripts/test_local_hub_smoke.py` matches `test_*.py`
      # but is not a unit test: it executes at import time and shells out to a compiled Rust
      # binary (target/debug/examples/local_hub), so discovery sweeps it up and fails with an
      # exec-format error on a runner that has never built it. Found by running this job's first
      # draft locally rather than by watching CI go red.
      #
      # So the suites are named explicitly, and the guard step below fails the build if a new
      # unittest file is added without being listed -- which keeps the explicit list from
      # silently rotting into an incomplete one.
      #
      # test_cloud_card arrived from PR #29 (the first Den-authored change) and the guard below did
      # exactly what it was built to do -- it would have failed this job until the name was added
      # here. Adding it is the mechanism working, not a workaround for it.
      - name: unit tests
        working-directory: scripts
        run: python3 -m unittest -v test_codex_effort_report test_cloud_card
      - name: no unittest suite left unlisted
        run: |
          set -euo pipefail
          listed="test_codex_effort_report test_cloud_card"
          missing=0
          for f in scripts/test_*.py; do
            base=$(basename "$f" .py)
            grep -q '^import unittest\|^from unittest' "$f" || continue
            case " $listed " in
              *" $base "*) ;;
              *) echo "::error file=$f::$base uses unittest but is not in the 'unit tests' step"; missing=1 ;;
            esac
          done
          [ "$missing" -eq 0 ] && echo "every unittest suite is listed"
      # Every other .py in scripts/ at least has to parse. Cheap, and it catches the class of
      # breakage where a script nobody ran this week stopped being valid Python.
      - name: every script parses
        run: |
          set -euo pipefail
          for f in scripts/*.py; do
            python3 -m py_compile "$f" || { echo "::error file=$f::does not compile"; exit 1; }
          done
          echo "all $(ls scripts/*.py | wc -l | tr -d ' ') scripts compile"

  cargo-deny:
    # Advisories, license policy, banned/duplicate deps, source allow-list (deny.toml).
    # continue-on-error until the first clean run has been reviewed — flip to
    # required once Jack has looked at the initial report.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with: { tool: cargo-deny }
      - run: cargo deny check
