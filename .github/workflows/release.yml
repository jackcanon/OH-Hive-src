name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   target: aarch64-apple-darwin,       cross: false }
          - { os: macos-latest,   target: x86_64-apple-darwin,        cross: false }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl,  cross: true }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-musl, cross: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,     cross: false }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09-03)
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { key: "${{ matrix.target }}" }
      - if: matrix.cross
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with: { tool: cross }
      - name: build
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p hive -p hive-server
          else
            cargo build --release --target ${{ matrix.target }} -p hive -p hive-server
          fi
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          T=${{ matrix.target }}; V=${GITHUB_REF_NAME#v}
          mkdir -p dist
          if [[ "$T" == *windows* ]]; then
            for b in hive hive-server; do cp target/$T/release/$b.exe dist/; done
            (cd dist && 7z a ../hive-$V-$T.zip hive.exe hive-server.exe >/dev/null)
          else
            for b in hive hive-server; do cp target/$T/release/$b dist/; done
            tar -C dist -czf hive-$V-$T.tar.gz hive hive-server
          fi
          ls -lh hive-*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: "hive-${{ matrix.target }}", path: "hive-*" }

  desktop-macos:
    name: desktop (macOS, Apple Silicon)
    runs-on: macos-latest
    env:
      # Set these repo secrets to get a signed + notarized .dmg (Jack has a Developer ID cert).
      # Left blank, the job still builds an unsigned dmg so releases never hard-fail.
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09-03)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { key: desktop-aarch64-apple-darwin }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: import Apple signing certificate
        if: env.APPLE_CERTIFICATE != ''
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

          echo "Available signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
      - name: build, sign + notarize dmg
        run: NODE_ENV=development pnpm --filter @hive/desktop tauri build --bundles dmg
      - name: staple notarization ticket to dmg (if notarized)
        if: env.APPLE_CERTIFICATE != '' && env.APPLE_ID != ''
        run: |
          set -euo pipefail
          # Tauri notarizes and staples the .app, then re-bundles it into the .dmg -- the
          # ticket never makes it onto the dmg container itself, so `spctl` on the shipped
          # artifact (the dmg, not the .app inside it) fails with "Insufficient Context"
          # even though notarization succeeded. Staple the dmg explicitly.
          #
          # Apple's ticket database (CloudKit-backed) lags a few seconds behind the notary
          # service saying "Accepted" -- a staple attempted immediately fails with
          # "CloudKit query ... Record not found" / "Could not find base64 encoded ticket"
          # even though the ticket exists. Retry with backoff instead of failing outright.
          DMG=$(ls target/release/bundle/dmg/*.dmg | head -n1)
          for attempt in 1 2 3 4 5; do
            if xcrun stapler staple "$DMG"; then
              exit 0
            fi
            echo "staple attempt $attempt failed, ticket may not have propagated yet -- retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          xcrun stapler staple "$DMG"
      - name: verify signature (if signed)
        if: env.APPLE_CERTIFICATE != ''
        run: |
          set -euo pipefail
          DMG=$(ls target/release/bundle/dmg/*.dmg | head -n1)
          echo "Verifying $DMG"
          # This is the actual Gatekeeper check a user's Mac performs on a downloaded dmg --
          # more meaningful here than codesign on the .app, whose bundle path/layout varies
          # by Tauri version and isn't the artifact we ship anyway.
          spctl -a -t open --context context:primary-signing -vv "$DMG"
      - name: collect dmg
        run: |
          set -euo pipefail
          V=${GITHUB_REF_NAME#v}
          mkdir -p out
          SRC=$(ls target/release/bundle/dmg/*.dmg | head -n1)
          cp "$SRC" "out/Hive-$V-macos-aarch64.dmg"
          ls -lh out/Hive-*.dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: "hive-desktop-macos", path: "out/Hive-*.dmg" }

  publish:
    needs: [build, desktop-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Fine-grained PAT, Contents: read/write on jackcanon/hive-releases only.
      # When set, the same assets are published to the public mirror so
      # `curl -fsSL https://ohghive.com/install.sh | sh` works without a token.
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { path: artifacts, merge-multiple: true }
      - name: checksums
        run: (cd artifacts && sha256sum hive-* Hive-*.dmg > SHA256SUMS)
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            artifacts/hive-*
            artifacts/Hive-*.dmg
            artifacts/SHA256SUMS
            scripts/install.sh
          generate_release_notes: true
      # NOTE: this external repo must be renamed on GitHub (or a new one created) to
      # jackcanon/hive-releases before this workflow will work — Jack needs to do this
      # manually, it's not something editable from the monorepo.
      - name: publish to public mirror (jackcanon/hive-releases)
        if: env.RELEASES_TOKEN != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          repository: jackcanon/hive-releases
          token: ${{ env.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          target_commitish: main
          name: ${{ github.ref_name }}
          make_latest: true
          body: |
            Hive node (`hive`) and regional server (`hive-server`) binaries.

            Install: `curl -fsSL https://ohghive.com/install.sh | sh` — then `hive pair`, `hive work`.

            Mirrored from the source repo's ${{ github.ref_name }} release. Verify with SHA256SUMS.
          files: |
            artifacts/hive-*
            artifacts/Hive-*.dmg
            artifacts/SHA256SUMS
            scripts/install.sh
      - name: mirror not configured
        if: env.RELEASES_TOKEN == ''
        run: echo "::warning::RELEASES_TOKEN secret not set — public mirror not updated. Run scripts/mirror-release.sh ${{ github.ref_name }} locally."
