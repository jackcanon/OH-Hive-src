name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   target: aarch64-apple-darwin,       cross: false }
          - { os: macos-latest,   target: x86_64-apple-darwin,        cross: false }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl,  cross: true }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-musl, cross: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,     cross: false }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.target }}" }
      - if: matrix.cross
        uses: taiki-e/install-action@v2
        with: { tool: cross }
      - name: build
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p hive -p hive-server
          else
            cargo build --release --target ${{ matrix.target }} -p hive -p hive-server
          fi
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          T=${{ matrix.target }}; V=${GITHUB_REF_NAME#v}
          mkdir -p dist
          if [[ "$T" == *windows* ]]; then
            for b in hive hive-server; do cp target/$T/release/$b.exe dist/; done
            (cd dist && 7z a ../ohhive-$V-$T.zip hive.exe hive-server.exe >/dev/null)
          else
            for b in hive hive-server; do cp target/$T/release/$b dist/; done
            tar -C dist -czf ohhive-$V-$T.tar.gz hive hive-server
          fi
          ls -lh ohhive-*
      - uses: actions/upload-artifact@v4
        with: { name: "ohhive-${{ matrix.target }}", path: "ohhive-*" }

  desktop-macos:
    name: desktop (macOS, Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { key: desktop-aarch64-apple-darwin }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: build app bundle
        run: NODE_ENV=development pnpm --filter @ohhive/desktop tauri build --bundles app
      - name: dmg
        run: |
          set -euo pipefail
          V=${GITHUB_REF_NAME#v}
          rm -rf dmgroot && mkdir dmgroot
          cp -R "target/release/bundle/macos/OH Hive.app" dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "OH Hive" -srcfolder dmgroot -ov -format UDZO "OH-Hive-$V-macos-aarch64.dmg"
          ls -lh OH-Hive-*.dmg
      - uses: actions/upload-artifact@v4
        with: { name: "ohhive-desktop-macos", path: "OH-Hive-*.dmg" }

  publish:
    needs: [build, desktop-macos]
    runs-on: ubuntu-latest
    env:
      # Fine-grained PAT, Contents: read/write on jackcanon/ohhive-releases only.
      # When set, the same assets are published to the public mirror so
      # `curl -fsSL https://ohghive.com/install.sh | sh` works without a token.
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - name: checksums
        run: (cd artifacts && sha256sum ohhive-* OH-Hive-*.dmg > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ohhive-*
            artifacts/OH-Hive-*.dmg
            artifacts/SHA256SUMS
            scripts/install.sh
          generate_release_notes: true
      - name: publish to public mirror (jackcanon/ohhive-releases)
        if: env.RELEASES_TOKEN != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: jackcanon/ohhive-releases
          token: ${{ env.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          target_commitish: main
          name: ${{ github.ref_name }}
          make_latest: true
          body: |
            OH Hive node (`hive`) and regional server (`hive-server`) binaries.

            Install: `curl -fsSL https://ohghive.com/install.sh | sh` — then `hive pair`, `hive work`.

            Mirrored from the source repo's ${{ github.ref_name }} release. Verify with SHA256SUMS.
          files: |
            artifacts/ohhive-*
            artifacts/OH-Hive-*.dmg
            artifacts/SHA256SUMS
            scripts/install.sh
      - name: mirror not configured
        if: env.RELEASES_TOKEN == ''
        run: echo "::warning::RELEASES_TOKEN secret not set — public mirror not updated. Run scripts/mirror-release.sh ${{ github.ref_name }} locally."
