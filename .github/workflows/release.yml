name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-gate:
    # Release v0.4.0 was tagged while the workspace Cargo.toml still said version = "0.3.0".
    # Every binary in that release therefore self-reports `hive 0.3.0`, and `hive --version`
    # cannot distinguish v0.3.0 from v0.4.0. That is not cosmetic: on 2026-09-16 it manufactured
    # a fleet blocker that did not exist -- heimdall-dam was carried in CONTINUITY.md for days as
    # "still on 0.3.0" when its installed binary hashed byte-for-byte to the v0.4.0 release
    # asset. It had been current the whole time and only *said* otherwise. An hour went into
    # chasing a node that needed nothing.
    #
    # A version audit is only as good as what the binary reports, so this job makes the tag and
    # the crate version agree or refuses to build the release at all.
    name: tag matches workspace version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - name: tag and Cargo.toml must agree
        shell: bash
        run: |
          set -euo pipefail
          # workflow_dispatch has no tag to check against; skip rather than fail, since a manual
          # run is usually a rebuild of something already tagged.
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "not a tag push (ref_type=${{ github.ref_type }}) -- nothing to compare"
            exit 0
          fi
          TAG="${GITHUB_REF_NAME#v}"
          CRATE=$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          if [ -z "$CRATE" ]; then
            CRATE=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          fi
          echo "tag:          $TAG"
          echo "Cargo.toml:   $CRATE"
          if [ -z "$CRATE" ]; then
            echo "::error::could not read a version out of Cargo.toml"
            exit 1
          fi
          if [ "$TAG" != "$CRATE" ]; then
            echo "::error::tag v$TAG does not match workspace version $CRATE. Bump [workspace.package] version in Cargo.toml (and commit it) before tagging, or retag to v$CRATE. Shipping these out of step makes every binary in the release lie about which version it is -- see the 2026-09-16 heimdall incident."
            exit 1
          fi
          echo "tag and workspace version agree"

  build:
    needs: version-gate
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   target: aarch64-apple-darwin,       cross: false }
          - { os: macos-latest,   target: x86_64-apple-darwin,        cross: false }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl,  cross: true }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-musl, cross: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,     cross: false }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09-03)
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { key: "${{ matrix.target }}" }
      - if: matrix.cross
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with: { tool: cross }
      - name: build
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p hive
            cross build --release --target ${{ matrix.target }} -p hive-server
          else
            cargo build --release --target ${{ matrix.target }} -p hive
            cargo build --release --target ${{ matrix.target }} -p hive-server
          fi
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          T=${{ matrix.target }}; V=${GITHUB_REF_NAME#v}
          mkdir -p dist
          if [[ "$T" == *windows* ]]; then
            for b in hive hive-server; do cp target/$T/release/$b.exe dist/; done
            (cd dist && 7z a ../hive-$V-$T.zip hive.exe hive-server.exe >/dev/null)
          else
            for b in hive hive-server; do cp target/$T/release/$b dist/; done
            tar -C dist -czf hive-$V-$T.tar.gz hive hive-server
          fi
          ls -lh hive-*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: "hive-${{ matrix.target }}", path: "hive-*" }

  desktop-macos:
    needs: version-gate
    name: desktop (macOS, Apple Silicon)
    runs-on: macos-latest
    env:
      # Set these repo secrets to get a signed + notarized .dmg (Jack has a Developer ID cert).
      # Left blank, the job still builds an unsigned dmg so releases never hard-fail.
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09-03)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { key: desktop-aarch64-apple-darwin }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: import Apple signing certificate
        if: env.APPLE_CERTIFICATE != ''
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

          echo "Available signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
      - name: build, sign + notarize dmg
        run: NODE_ENV=development pnpm --filter @hive/desktop tauri build --bundles dmg
      - name: notarize dmg
        if: env.APPLE_CERTIFICATE != '' && env.APPLE_ID != ''
        run: |
          set -euo pipefail
          # Tauri notarizes and staples the .app, then re-signs (NOT re-notarizes) it into the
          # .dmg -- so a notarization ticket only ever exists for the .app's hash, never for the
          # dmg container's own hash. `xcrun stapler staple` on the dmg was failing with
          # "CloudKit query ... Record not found" on every attempt, unconditionally -- a real
          # run (2026-09-12) confirmed this directly: 20 attempts over 10 minutes, all identical
          # failures, no narrowing. That ruled out propagation lag as the cause (the previous
          # fix here, widening the retry window, addressed the wrong theory). The dmg simply
          # never had a ticket to find. Submit the dmg itself for notarization so one exists.
          DMG=$(ls target/release/bundle/dmg/*.dmg | head -n1)
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_PASSWORD" \
            --wait
      - name: staple notarization ticket to dmg (if notarized)
        if: env.APPLE_CERTIFICATE != '' && env.APPLE_ID != ''
        run: |
          set -euo pipefail
          # notarytool --wait above only returns once the notary service itself says
          # "Accepted" -- but Apple's ticket database (CloudKit-backed) can still lag a short
          # while behind that. Now that a real ticket exists for the dmg's own hash, a brief
          # retry covers just that propagation gap (this is the case the old 20x30s loop was
          # meant for -- it just never got a ticket to actually find).
          DMG=$(ls target/release/bundle/dmg/*.dmg | head -n1)
          for attempt in $(seq 1 6); do
            if xcrun stapler staple "$DMG"; then
              exit 0
            fi
            echo "staple attempt $attempt/6 failed, ticket may not have propagated yet -- retrying in 15s"
            sleep 15
          done
          xcrun stapler staple "$DMG"
      - name: verify signature (if signed)
        if: env.APPLE_CERTIFICATE != ''
        run: |
          set -euo pipefail
          DMG=$(ls target/release/bundle/dmg/*.dmg | head -n1)
          echo "Verifying $DMG"
          # This is the actual Gatekeeper check a user's Mac performs on a downloaded dmg --
          # more meaningful here than codesign on the .app, whose bundle path/layout varies
          # by Tauri version and isn't the artifact we ship anyway.
          spctl -a -t open --context context:primary-signature -vv "$DMG"
      - name: collect dmg
        run: |
          set -euo pipefail
          V=${GITHUB_REF_NAME#v}
          mkdir -p out
          SRC=$(ls target/release/bundle/dmg/*.dmg | head -n1)
          cp "$SRC" "out/Hive-$V-macos-aarch64.dmg"
          ls -lh out/Hive-*.dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: "hive-desktop-macos", path: "out/Hive-*.dmg" }

  desktop-swift-macos:
    needs: version-gate
    name: desktop (Swift, macOS Apple Silicon)
    runs-on: macos-latest
    env:
      # Same Developer ID cert/credentials as desktop-macos (Jack's real cert). Left blank, the
      # job still builds and ships an ad-hoc-signed .app/.dmg so releases never hard-fail -- just
      # not one Gatekeeper will accept on someone else's Mac without a right-click override.
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09-03)
        with: { targets: aarch64-apple-darwin }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { key: desktop-swift-aarch64-apple-darwin }
      - name: import Apple signing certificate
        if: env.APPLE_CERTIFICATE != ''
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

          echo "Available signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
      # build-app.sh owns Rust build + matching binding generation + bundled library.
      # Keep one entry point so CI and local bundles cannot use different FFI pairs.
      - name: fetch cloudflared (bundled Tunnel resource)
        # Same pinned binary apps/desktop/src-tauri/build.rs fetches (ADR-013 D74/ADR-018 task
        # #71) -- fetched independently here rather than depending on that job having run first.
        run: |
          set -euo pipefail
          mkdir -p apps/desktop/src-tauri/resources
          DEST=apps/desktop/src-tauri/resources/cloudflared-aarch64-apple-darwin
          curl -fsSL -o "$RUNNER_TEMP/cloudflared.tgz" \
            https://github.com/cloudflare/cloudflared/releases/download/2026.8.3/cloudflared-darwin-arm64.tgz
          tar -xzf "$RUNNER_TEMP/cloudflared.tgz" -C apps/desktop/src-tauri/resources
          mv apps/desktop/src-tauri/resources/cloudflared "$DEST"
          chmod 755 "$DEST"
      - name: build + sign Hive.app
        working-directory: apps/desktop-swift
        run: |
          set -euo pipefail
          V=${GITHUB_REF_NAME#v}
          OHHIVE_APP_VERSION="$V" OHHIVE_SIGN_IDENTITY="${APPLE_SIGNING_IDENTITY:--}" ./scripts/build-app.sh
      - name: verify portable bundle and launch diagnostics
        working-directory: apps/desktop-swift
        run: ./scripts/test-app-bundle.sh "$PWD/Hive.app"
      - name: package dmg
        working-directory: apps/desktop-swift
        run: |
          set -euo pipefail
          rm -f Hive.dmg
          hdiutil create -volname Hive -srcfolder Hive.app -ov -format UDZO Hive.dmg
      - name: sign dmg
        if: env.APPLE_CERTIFICATE != ''
        working-directory: apps/desktop-swift
        run: codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp Hive.dmg
      - name: notarize dmg
        if: env.APPLE_CERTIFICATE != '' && env.APPLE_ID != ''
        working-directory: apps/desktop-swift
        # See desktop-macos's "notarize dmg" step for why this has to be an explicit submission
        # of the dmg itself, not just a staple attempt against the .app's ticket.
        run: |
          set -euo pipefail
          xcrun notarytool submit Hive.dmg \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_PASSWORD" \
            --wait
      - name: staple notarization ticket to dmg (if notarized)
        if: env.APPLE_CERTIFICATE != '' && env.APPLE_ID != ''
        working-directory: apps/desktop-swift
        run: |
          set -euo pipefail
          for attempt in $(seq 1 6); do
            if xcrun stapler staple Hive.dmg; then
              exit 0
            fi
            echo "staple attempt $attempt/6 failed, ticket may not have propagated yet -- retrying in 15s"
            sleep 15
          done
          xcrun stapler staple Hive.dmg
      - name: verify signature (if signed)
        if: env.APPLE_CERTIFICATE != ''
        working-directory: apps/desktop-swift
        run: spctl -a -t open --context context:primary-signature -vv Hive.dmg
      - name: collect dmg
        working-directory: apps/desktop-swift
        run: |
          set -euo pipefail
          V=${GITHUB_REF_NAME#v}
          mkdir -p out
          cp Hive.dmg "out/Hive-Swift-$V-macos-aarch64.dmg"
          ls -lh out/Hive-Swift-*.dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: "hive-desktop-swift-macos", path: "apps/desktop-swift/out/Hive-Swift-*.dmg" }

  # Linux got a CLI and nothing else. The Tauri .deb and .AppImage have been buildable since
  # desktop-windows-linux.yml landed, but that workflow produces them as throwaway CI artifacts to
  # test with -- they were never attached to a release, so anyone installing Linux from
  # install.sh received a bare binary and no way to discover a UI existed at all.
  #
  # NOT continue-on-error, deliberately, unlike the same build in desktop-windows-linux.yml. There
  # it is a probe asking "does this compile"; here it is a deliverable. A release that quietly
  # ships without the Linux UI is the silent-partial-success failure mode -- nothing is red, the
  # assets just aren't there, and the first person to notice is a Linux user who cannot find the
  # app. Better that the release fails loudly and someone decides, than that it succeeds wrongly.
  desktop-linux:
    needs: version-gate
    name: desktop (Linux, x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09-03)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { key: release-desktop-linux }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: pnpm }
      # Tauri v2 on Linux links against webkit2gtk-4.1 and libsoup3; without these the bundle step
      # fails in pkg-config, which looks like a code error and isn't one. Kept identical to
      # desktop-windows-linux.yml's list on purpose -- if the two drift, this job stops building
      # what that workflow tests.
      - name: linux webview dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf
      - run: pnpm install --frozen-lockfile
      - name: tauri build
        run: pnpm --filter @hive/desktop tauri build --bundles deb,appimage
        env:
          NODE_ENV: development
      # Tauri names its output from tauri.conf.json (hive_0.4.1_amd64.deb and friends), which is
      # neither the release's naming convention nor something to hardcode -- find what was built
      # and rename it, so a future Tauri naming change surfaces as "no bundle found" rather than
      # as an asset silently missing from the release.
      - name: collect bundles
        run: |
          set -euo pipefail
          V=${GITHUB_REF_NAME#v}
          mkdir -p out
          DEB=$(find target -path '*/bundle/deb/*.deb' -type f | head -1)
          APP=$(find target -path '*/bundle/appimage/*.AppImage' -type f | head -1)
          [ -n "$DEB" ] || { echo "::error::no .deb produced by tauri build"; exit 1; }
          [ -n "$APP" ] || { echo "::error::no .AppImage produced by tauri build"; exit 1; }
          cp "$DEB" "out/Hive-$V-linux-x86_64.deb"
          cp "$APP" "out/Hive-$V-linux-x86_64.AppImage"
          ls -lh out/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: "hive-desktop-linux", path: "out/Hive-*-linux-*" }

  publish:
    needs: [build, desktop-macos, desktop-swift-macos, desktop-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Fine-grained PAT, Contents: read/write on jackcanon/ohhive-releases only.
      # When set, the same assets are published to the public mirror so
      # `curl -fsSL https://ohghive.com/install.sh | sh` works without a token.
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { path: artifacts, merge-multiple: true }
      # Hive-* rather than Hive-*.dmg: the Linux .deb and .AppImage are release assets too, and a
      # checksum list that silently omits half the desktop downloads is worse than no list, because
      # it looks complete. install.sh reads this file to resolve "latest" via a case-sensitive
      # `hive-` match, so the added Hive-* lines are inert to it.
      - name: checksums
        run: (cd artifacts && sha256sum hive-* Hive-* > SHA256SUMS)
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            artifacts/hive-*
            artifacts/Hive-*
            artifacts/SHA256SUMS
            scripts/install.sh
          generate_release_notes: true
      # The public mirror repo (jackcanon/ohhive-releases) already exists and already has
      # real releases through v0.3.0 -- this step's repo name previously said
      # "jackcanon/hive-releases" (no "oh" prefix), a repo that doesn't exist (confirmed:
      # GET /repos/jackcanon/hive-releases -> 404), while both /pair's "Download Hive.app"
      # link and install.sh point at ohhive-releases. Fixed to match the repo that's
      # actually live -- this had been silently no-op'ing (or failing) every mirror publish.
      - name: publish to public mirror (jackcanon/ohhive-releases)
        if: env.RELEASES_TOKEN != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          repository: jackcanon/ohhive-releases
          token: ${{ env.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          target_commitish: main
          name: ${{ github.ref_name }}
          make_latest: true
          body: |
            ### Desktop app

            - **macOS (Apple Silicon)** — `Hive-Swift-*-macos-aarch64.dmg`
            - **Linux (x86_64)** — `Hive-*-linux-x86_64.deb` or `Hive-*-linux-x86_64.AppImage`

            ### Command line

            `curl -fsSL https://ohghive.com/install.sh | sh` — then `hive pair`, `hive work`.

            Works everywhere, including Intel Macs and Windows, and is all you need to contribute
            compute. The desktop app is the same node with a window on it.

            Every file below is listed in SHA256SUMS; verify before you run it.
            Mirrored from the source repo's ${{ github.ref_name }} release.
          # Hive-* not Hive-*.dmg. This mirror is the repo end users actually download from -- it is
          # where install.sh and the /pair "Download Hive.app" link point -- so a glob that only
          # matched .dmg meant the desktop app existed on macOS and nowhere else, no matter what the
          # source repo's release contained.
          files: |
            artifacts/hive-*
            artifacts/Hive-*
            artifacts/SHA256SUMS
            scripts/install.sh
      - name: mirror not configured
        if: env.RELEASES_TOKEN == ''
        run: echo "::warning::RELEASES_TOKEN secret not set — public mirror not updated. Run scripts/mirror-release.sh ${{ github.ref_name }} locally."
