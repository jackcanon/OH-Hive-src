name: codeql
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  schedule:
    - cron: "24 3 * * 1" # weekly, Monday 03:24 UTC

permissions:
  contents: read

jobs:
  analyze-rust:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09-03)
      - uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          languages: rust
          build-mode: manual
      - name: build (core, cli, server, coordinator)
        run: cargo build --workspace --exclude ohhive-desktop
      - uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with: { category: "/language:rust" }

  analyze-web:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with: { category: "/language:javascript-typescript" }
