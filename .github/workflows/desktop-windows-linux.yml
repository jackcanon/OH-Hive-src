# Windows and Linux desktop builds for Loki's Den.
#
# Why this exists as its own workflow: ADR-018 decision 1 keeps the Tauri (Rust + React) app as the
# Windows and Linux shell, while macOS moves to the native Swift app. `release.yml` builds the Tauri
# app for macOS only, so until now nothing in CI had ever compiled it for Windows or Linux — which
# means "does the Den run on Windows" was an open question with no evidence either way. This answers
# it, and hands back installers to test with.
#
# It is deliberately separate from `release.yml` rather than another matrix leg there:
#   - it must be runnable on demand (`workflow_dispatch`), not only on a version tag;
#   - a failure here must not block a macOS release, because it is diagnosing new ground;
#   - `continue-on-error` on the bundle steps means one platform failing still tells us about the
#     other, which is the whole point of a first run.
#
# Unsigned artifacts. Windows code signing (an EV or Azure Trusted Signing cert) and Linux
# packaging beyond .deb/.AppImage are separate decisions Jack hasn't made yet; SmartScreen will
# warn on an unsigned .msi, which is expected and fine for testing.
name: desktop (Windows + Linux)

on:
  workflow_dispatch:
  # `main` only, and only for paths that can actually change the answer. Windows runner minutes bill
  # at 2x, and this workflow uses two of them; firing it on every branch push would be expensive for
  # no extra information.
  push:
    branches: [main]
    paths:
      - '.github/workflows/desktop-windows-linux.yml'
      - 'apps/desktop/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

jobs:
  # Stage 1 — does the shared Rust core even compile for these targets? Split out from the bundle
  # job so a failure tells us *where* the problem is: our own code and its crate graph, or the
  # platform's GUI/webview layer. This is the cheaper, more informative half.
  core:
    name: core (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09-03)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { key: "core-${{ matrix.target }}" }
      # The exact feature set `apps/desktop/src-tauri` asks for, so this is a real proxy for the
      # app's crate graph and not a weaker subset.
      - name: cargo check (desktop feature set)
        run: >
          cargo check -p hive-core --target ${{ matrix.target }}
          --features subscription-coordinator,hub,probe,llama-cpp,sandbox,setup,tunnel,bots,local-hub
      # The core's own test suite on this platform. Portability bugs in a shared core are usually
      # path handling and line endings, and those only ever show up when the tests actually run
      # somewhere other than a Mac.
      - name: cargo test (core)
        run: >
          cargo test -p hive-core --target ${{ matrix.target }}
          --features subscription-coordinator,hub,probe,llama-cpp,sandbox,setup,tunnel,bots,local-hub
      # The CLI and server already ship for both platforms from `release.yml`; building them here
      # too keeps this workflow a single place to look when something platform-shaped breaks.
      # Release build, and uploaded -- this is how fleet machines get a current binary without
      # a Rust toolchain of their own. Heimdall is Ubuntu 24.04/glibc 2.39, the same as
      # ubuntu-latest, so the gnu build runs there as-is; a musl build would be needed only for
      # an older distro.
      - name: cargo build (hive CLI + server, release)
        run: cargo build --release --target ${{ matrix.target }} -p hive -p hive-server
      - name: stage binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          T=${{ matrix.target }}
          if [[ "$T" == *windows* ]]; then
            cp "target/$T/release/hive.exe" "target/$T/release/hive-server.exe" dist/
          else
            cp "target/$T/release/hive" "target/$T/release/hive-server" dist/
          fi
          ls -lh dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hive-cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Stage 2 — the actual installers. Needs the frontend toolchain and, on Linux, the webkit2gtk
  # system libraries Tauri's webview links against.
  bundle:
    name: bundle (${{ matrix.label }})
    needs: core
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: windows, bundles: 'msi,nsis' }
          - { os: ubuntu-latest,  label: linux,   bundles: 'deb,appimage' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09-03)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { key: "bundle-${{ matrix.label }}" }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      # Tauri v2 on Linux links against webkit2gtk-4.1 and libsoup3; without these the bundle step
      # fails in pkg-config, which looks like a code error and isn't one.
      - name: linux webview dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf
      - run: pnpm install --frozen-lockfile
      - name: tauri build
        id: build
        continue-on-error: true
        run: pnpm --filter @hive/desktop tauri build --bundles ${{ matrix.bundles }}
        env:
          NODE_ENV: development
      # Runs even when the build failed, so a first run tells us what got produced before it broke
      # rather than only that it broke.
      #
      # Read `outcome`, never the step's reported conclusion: a `continue-on-error` step that fails
      # is *reported* as succeeding (that is what the flag does), and only `outcome` holds what
      # actually happened. Worth the comment because reading the reported conclusion instead is how
      # you conclude a bundle built when it did not.
      - name: what got built
        if: always()
        shell: bash
        run: |
          echo "tauri build outcome: ${{ steps.build.outcome }}"
          echo "--- bundle tree ---"
          find target/release/bundle -type f 2>/dev/null | head -40 || echo "no bundle directory"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: den-${{ matrix.label }}
          path: |
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
          if-no-files-found: warn
      # A failed bundle after a green `core` job is the interesting case — it means our code is
      # portable and the gap is in the shell. Say so in the summary rather than making whoever
      # reads the run work it out.
      - name: verdict
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            echo "::notice::${{ matrix.label }}: installer built. Download the den-${{ matrix.label }} artifact to test."
          else
            echo "::warning::${{ matrix.label }}: the shared core compiled and tested clean, but the Tauri bundle did not build. The gap is in the shell/webview layer, not in hive-core. Known starting point: tauri.conf.json declares bundle.targets = [app, dmg] (macOS only) with empty linux/windows sections."
            exit 1
          fi
